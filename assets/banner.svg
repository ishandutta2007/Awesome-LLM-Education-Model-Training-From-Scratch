<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="420" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070913"/><stop offset="50%" stop-color="#0d1127"/><stop offset="100%" stop-color="#05070e"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f857a6"/><stop offset="100%" stop-color="#ff5858"/></linearGradient><linearGradient id="accentEmerald" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#43e97b"/><stop offset="100%" stop-color="#38f9d7"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#00f2fe"/><stop offset="80%" stop-color="#9b51e0"/><stop offset="100%" stop-color="#ff5858"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="rgba(0, 242, 254, 0.15)"/><stop offset="100%" stop-color="rgba(155, 81, 224, 0.15)"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowPurple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.45}50%{transform:scale(1.15) translate(25px,-15px);opacity:.75}}@keyframes pulseOrb2{0%{transform:scale(1) translate(0,0);opacity:.4}50%{transform:scale(1.2) translate(-30px,20px);opacity:.7}}@keyframes floatParticle{0%{transform:translateY(0) scale(.8);opacity:.2}50%{transform:translateY(-20px) scale(1.2);opacity:.8}}@keyframes waveFlow{0%{stroke-dashoffset:0}}.banner-sub,.banner-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.banner-title{font-size:40px;font-weight:900;letter-spacing:-.5px}.banner-sub{font-size:17px;font-weight:500;fill:#cbd5e1}.banner-badge{font-family:&apos;SF Mono&apos;,Consolas,Monaco,monospace;font-size:12px;font-weight:700;letter-spacing:.5px}.orb-cyan{animation:pulseOrb 7s ease-in-out infinite;transform-origin:200px 100px}.orb-purple{animation:pulseOrb2 9s ease-in-out infinite;transform-origin:1000px 300px}.p1{animation:floatParticle 4s ease-in-out infinite}.p2{animation:floatParticle 6s ease-in-out infinite 1s}.p3{animation:floatParticle 5s ease-in-out infinite 2s}.flow-wave{stroke-dasharray:20,15;animation:waveFlow 25s linear infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#grid)"/><g class="orb-cyan"><circle cx="160" cy="110" r="160" fill="url(#accentCyan)" filter="url(#glowCyan)" opacity=".4"/></g><g class="orb-purple"><circle cx="1040" cy="300" r="190" fill="url(#accentPurple)" filter="url(#glowPurple)" opacity=".35"/></g><g><circle cx="620" cy="40" r="90" fill="url(#accentEmerald)" filter="url(#glowCyan)" opacity=".25"/></g><path fill="none" stroke="rgba(0, 242, 254, 0.28)" stroke-width="2.5" d="M -50,340 C 250,220 400,380 650,300 C 900,220 1050,360 1250,280" class="flow-wave"/><path fill="none" stroke="rgba(248, 87, 166, 0.22)" stroke-width="2" d="M -50,370 C 220,260 450,420 700,340 C 950,260 1080,390 1250,310" class="flow-wave"/><circle cx="280" cy="80" r="3" fill="#00f2fe" class="p1"/><circle cx="920" cy="120" r="4" fill="#f857a6" class="p2"/><circle cx="750" cy="360" r="3" fill="#43e97b" class="p3"/><circle cx="420" cy="370" r="2.5" fill="#00f2fe" class="p2"/><circle cx="1100" cy="90" r="3.5" fill="#ff5858" class="p1"/><circle cx="120" cy="340" r="2.5" fill="#38f9d7" class="p3"/><g transform="translate(420, 48)"><rect width="360" height="34" fill="url(#pillGrad)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.2" rx="17"/><circle cx="22" cy="17" r="5" fill="#43e97b"/><text x="36" y="22" fill="#00f2fe" class="banner-badge">CURATED OPEN-SOURCE &amp; SAAS CATALOG</text></g><text x="600" y="150" fill="url(#titleGrad)" class="banner-title" text-anchor="middle">Awesome LLM Education</text><text x="600" y="200" fill="#fff" class="banner-title" font-size="34" text-anchor="middle">Model Training From Scratch</text><text x="600" y="255" class="banner-sub" text-anchor="middle">From First Principles to Production: Transformers • Pre-Training • Pure-C/CUDA • RLHF • Fine-Tuning</text><g><g transform="translate(145, 305) translate(0, 0)"><rect width="180" height="38" fill="rgba(13, 17, 39, 0.85)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" rx="8"/><text x="90" y="24" fill="#00f2fe" class="banner-badge" text-anchor="middle">⚡ NANO-GPT &amp; LLM.C</text></g><g transform="translate(145, 305) translate(195, 0)"><rect width="170" height="38" fill="rgba(13, 17, 39, 0.85)" stroke="rgba(67, 233, 123, 0.3)" stroke-width="1" rx="8"/><text x="85" y="24" fill="#43e97b" class="banner-badge" text-anchor="middle">🚀 CUDA &amp; TRITON</text></g><g transform="translate(145, 305) translate(380, 0)"><rect width="180" height="38" fill="rgba(13, 17, 39, 0.85)" stroke="rgba(155, 81, 224, 0.35)" stroke-width="1" rx="8"/><text x="90" y="24" fill="#c084fc" class="banner-badge" text-anchor="middle">🧠 FLASHATTN &amp; MLA</text></g><g transform="translate(145, 305) translate(575, 0)"><rect width="165" height="38" fill="rgba(13, 17, 39, 0.85)" stroke="rgba(248, 87, 166, 0.35)" stroke-width="1" rx="8"/><text x="82" y="24" fill="#f472b6" class="banner-badge" text-anchor="middle">🎯 RLHF &amp; GRPO</text></g><g transform="translate(145, 305) translate(755, 0)"><rect width="155" height="38" fill="rgba(13, 17, 39, 0.85)" stroke="rgba(255, 88, 88, 0.3)" stroke-width="1" rx="8"/><text x="77" y="24" fill="#fca5a5" class="banner-badge" text-anchor="middle">📚 100% OPEN-SOURCE</text></g></g><rect width="1200" height="4" x="0" y="416" fill="url(#titleGrad)"/></svg>